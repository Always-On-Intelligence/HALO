  # ------------------------------------------------------------------------------------------------
  - id: feature_flags
    owner: Dev Malhotra, who leads frontend platform work at Shopwise, an online retailer (GitHub organization shopwise)
    org: shopwise
    date: "2026-11-02"
    design: >-
      Four teams declare feature flags in four places, all in the organization guide. Since 2026-10 every new flag
      names its ticket and an expiry, which older flags lack; each team adds its own rules (sorted keys and a generated
      file in checkout-web, one JSON file per flag in search-api, a security reviewer for sign-in flags in account-web,
      a staging-only environment list in orders-svc). Copying L1/L2's format fails in T1/T2.
    org_guide: |
      # Contributing to Shopwise repositories

      This is the default contributing guide of the shopwise organization. It applies to every repository without a
      CONTRIBUTING file of its own, which is all of them. `make check` in each repository enforces its section.

      ## Feature flags

      New flags are off by default. Since 2026-10-01 every new flag records the ticket of the work (from the request)
      and when it should be removed; older flags predate this.

      ### checkout-web

      - Declare the flag in `config/flags.yaml`, which stays sorted alphabetically by key. `src/flags.generated.ts` is
        generated from it by `make flags` in CI; never edit it.
      - Fields, in this order: `key: checkout-<kebab-case-name>`, `owner: "@team-checkout"`, `default: false`,
        `ticket: <ticket>`, `expires: YYYY-MM-DD` (at most 90 days from today), `description: <one sentence>`.

      ### search-api

      - One JSON file per flag, `flags/<snake_case_name>.json`, with exactly these keys in this order: `name` (equal to
        the file name), `description`, `owner` (`"team-search"`), `ticket`, `rollout_percent` (`0` for a new flag),
        `created` and `expires` (dates as `"YYYY-MM-DD"`, `expires` at most 90 days after `created`).
      - No other file lists flags.

      ### account-web

      - Register the flag in `src/flags/registry.ts`, in the `FLAGS` object, sorted by key, one line per flag:
        `acctName: { default: false, owner: "@team-accounts", ticket: "ACC-<n>", removeBy: "YYYY-MM-DD" },`
      - Keys are camelCase and start with `acct`; `removeBy` is at most 120 days from today.
      - Flags that gate sign-in or account recovery also set `securityReview: "@team-security"` as the last field.
      - Do not declare flags anywhere else.

      ### orders-svc

      - Append one table per flag at the end of `config/features.toml`:
        `[features.<snake_case_name>]` with `enabled = false`, `owner = "orders-core"`, `ticket = "<ticket>"`,
        `review_by = YYYY-MM-DD` and `environments = ["staging"]`, in that order.
      - Do not add flag files anywhere else.
    tasks:
