            # Decision log

            ## DL-1: Use PostGIS for road network storage (2025-09-02)

            In the context of storing the road graph, facing frequent spatial queries, we decided for PostGIS and against a graph database, to achieve simple operations, accepting slower shortest-path queries.

            ## DL-2: Cache routes for ten minutes (2025-11-18)

            In the context of repeated route requests, facing high router load, we decided for a ten-minute route cache and against no caching, to achieve lower latency, accepting slightly stale routes.

            ## DL-3: Use H3 cells for zone lookups (2026-02-05)

            In the context of mapping orders to delivery zones, facing polygon lookups on every request, we decided for H3 cells and against point-in-polygon queries, to achieve constant-time lookups, accepting coarser zone edges.

            ## DL-4: Recompute ETAs every 60 seconds (2026-06-30)

            In the context of live delivery tracking, facing traffic changes, we decided for recomputing ETAs every 60 seconds and against event-driven recomputation, to achieve predictable load, accepting up to a minute of staleness.

            ## DL-5: Compute ETAs with the in-house router (2026-10-26)

            In the context of ETA computation, facing inconsistent ETAs between dispatch and tracking, we decided for the in-house graph router with OSRM only as a timeout fallback and against OSRM as the primary router, to achieve consistency with the dispatch rules, accepting higher CPU use.

            Deciders: Priya Raman, Marco Rossi
