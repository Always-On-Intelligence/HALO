            # 3. Token bucket rate limiting

            Date: 2026-10-26
            Deciders: Priya Raman, Omar Haddad

            ## Status

            Proposed

            Supersedes ADR-0002

            ## Context

            Fixed windows let clients send twice the limit across a window boundary.

            ## Decision

            Use a token bucket per client with a burst of twice the per-second rate, stored in Redis.

            ## Consequences

            Smoother limits; one Redis round trip per request.
          docs/adr/0002-fixed-window-rate-limits.md: |
            # 2. Fixed-window rate limits

            Date: 2026-01-12

            ## Status

            Superseded by ADR-0003

            ## Context

            We need per-client request limits at the edge.

            ## Decision

            Count requests per client in fixed one-second windows in Envoy's local rate limit filter.

            ## Consequences

            Simple and cheap; bursts at window boundaries can reach twice the limit.
