  - id: db_migrations
    owner: Tomás Okafor, backend lead at Ledgerly, a small invoicing company (GitHub organization ledgerly)
    org: ledgerly
    date: "2026-10-19"
    design: >-
      Four services with four migration tools, all covered by the organization guide. Since 2026-09-15 every new
      migration starts with a ticket line, which no existing migration shows; each service adds tool-specific rules
      (Alembic revision ids from the file name, CONCURRENTLY index pairs, a Knex column comment, a Django help_text).
      An agent that mimics the existing files fails L1 and L2; the test services need sections it has not seen.
    org_guide: |
      # Contributing to Ledgerly services

      This is the default contributing guide of the ledgerly organization. It applies to every service repository
      without a CONTRIBUTING file of its own, which is all of them. `make check` in each repository enforces its section.

      ## Database migrations

      Every schema change ships as a migration in the same pull request.

      - Since 2026-09-15 the first line of every new migration file names the ticket of the change:
        `# Ticket: LED-<number>` in Python, `-- Ticket: LED-<number>` in SQL, `// Ticket: LED-<number>` in JavaScript.
        Older migrations predate this rule; never edit a merged migration to add it.
      - Columns added to existing tables are nullable.

      ### invoices-api (Alembic)

      - File `migrations/versions/<YYYYMMDD>_<HHMM>_<snake_case_slug>.py` from the current UTC time.
      - `revision` is the file name without `.py`; `down_revision` is the current head (the newest file's `revision`).
      - `downgrade()` reverts `upgrade()` exactly; `pass` is not allowed.
      - Update `app/models.py` in the same change.

      ### ledger-core (golang-migrate)

      - A pair `db/migrations/<6-digit sequence>_<snake_case_name>.up.sql` and `.down.sql`; the sequence is the
        highest existing number plus one.
      - Index changes use `CONCURRENTLY` in both directions with one statement per file:
        `CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_<table>_<columns> ON <table> (<columns>);` and
        `DROP INDEX CONCURRENTLY IF EXISTS idx_<table>_<columns>;`

      ### notify-svc (Knex)

      - File `migrations/<YYYYMMDDHHMMSS>_<snake_case_name>.js`, CommonJS: `exports.up = ...` and `exports.down = ...`.
      - Change existing tables with `knex.schema.alterTable(...)`; never use `knex.raw`.
      - Every new column carries a column comment: `.comment("<what it stores>")`.
      - `down` drops what `up` added.

      ### reports-worker (Django)

      - `reports/migrations/<4-digit number>_<name>.py`, the number being the latest plus one; `dependencies` points
        at the latest migration.
      - A field added to `Report` (a large table) has `null=True`, a `help_text`, and no `default`.
      - Update `reports/models.py` in the same change.
