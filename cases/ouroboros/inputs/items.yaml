          fastslug/__init__.py: |
            from .core import slugify

            __all__ = ["slugify"]
          fastslug/core.py: |
            import re
            import unicodedata

            _NON_WORD = re.compile(r"[^a-z0-9]+")


            def slugify(text, separator="-", max_length=None):
                """Return a lowercase ASCII slug for ``text``."""
                ascii_text = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode()
                slug = _NON_WORD.sub(separator, ascii_text.lower()).strip(separator)
                if max_length is not None and len(slug) > max_length:
                    cut = slug[: max_length + 1]
                    slug = cut.rsplit(separator, 1)[0] if separator in cut else slug[:max_length]
                return slug
