          tidyconf/loader.py: |
            """Load layered TOML files and apply environment overrides."""
            import os
            import tomllib


            def _merge(base, extra):
                for key, value in extra.items():
                    if isinstance(value, dict) and isinstance(base.get(key), dict):
                        _merge(base[key], value)
                    else:
                        base[key] = value
                return base


            def load(*paths, env_prefix=None):
                config = {}
                for path in paths:
                    with open(path, "rb") as fh:
                        data = fh.read().decode("utf-8-sig")
                    if not data.strip():
                        continue
                    _merge(config, tomllib.loads(data))
                if env_prefix:
                    for name, value in os.environ.items():
                        if name.startswith(env_prefix):
                            keys = name[len(env_prefix):].lower().split("__")
                            node = config
                            for key in keys[:-1]:
                                node = node.setdefault(key, {})
                            node[keys[-1]] = value
                return config
