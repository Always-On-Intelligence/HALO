    org_guide: |
      # Contributing to mara-libs projects

      This is the default contributing guide of the mara-libs organization. It applies to every repository that has
      no CONTRIBUTING file of its own, which is all of them. `make check` in each repository enforces its section.

      ## Recording changes

      Every pull request records its user-visible change in the same pull request. Each project does it its own way.

      ### tidyconf: news fragments (towncrier)

      - Add one file `newsfragments/<pull request number>.<type>.md`. Use the pull request number, not the issue number.
      - `<type>` is one of `added`, `changed`, `fixed`, `removed`.
      - The file is one sentence on one line that starts with a past-tense verb and ends with a period. Do not mention
        the issue or the pull request in the text: towncrier adds the link.
      - Never edit `CHANGES.rst`; it is assembled when a release is cut.

      ### fastslug: entry files (scriv)

      - Add one file `changelog.d/<pull request number>.md`.
      - It holds a level-3 heading with the category (`### Added`, `### Changed`, `### Fixed` or `### Removed`), a blank
        line, and one bullet: ``- `<function>`: <the change in the past tense> (#<pull request>)``.
      - Never edit `CHANGELOG.md`; scriv collects the entries when a release is made.

      ### lintkit: changesets

      - Add one changeset `.changeset/<three or more lowercase words joined by hyphens>.md`.
      - Front matter: `"lintkit": patch` for fixes, `minor` for new rules or options, `major` for breaking changes.
      - The summary is one line: the affected rule in backticks, a colon, and the change in the past tense, for example
        `` `no-floating-promises`: Fixed a crash on optional call chains.``
      - Never edit `CHANGELOG.md`; `changeset version` generates it.

      ### pyretry: Keep a Changelog

      - Edit `CHANGELOG.md` by hand in the same pull request. Do not add fragment or entry files.
      - Put the line under `## [Unreleased]`, in the matching subsection; subsections appear in the order `### Added`,
        `### Changed`, `### Fixed`, `### Removed`, and you create one when it is missing.
      - Line format: `- <the change in the past tense> ([#<PR>](https://github.com/mara-libs/pyretry/pull/<PR>))`
      - Since 2026-10-01 a change contributed from outside the organization credits its author inside the parentheses:
        `([#<PR>](https://github.com/mara-libs/pyretry/pull/<PR>), thanks @<GitHub user>)`. Older entries predate this.
