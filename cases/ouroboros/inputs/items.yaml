  # ------------------------------------------------------------------------------------------------
  - id: decision_records
    owner: Priya Raman, staff engineer on the Atlas logistics platform (GitHub organization atlas-platform)
    org: atlas-platform
    date: "2026-10-26"
    design: >-
      Four Atlas services record architecture decisions in four formats, all in the organization guide. Since 2026-10
      every new record names its deciders, which no existing record shows. L1 (Nygard ADR that supersedes ADR-0002) and
      L2 (MADR 4 with a Consequences subsection) fail on unstated rules; T1 appends a Y-statement to a single log and
      forbids per-decision files; T2 files new records under proposed/ with an index row.
    org_guide: |
      # Contributing to Atlas platform services

      This is the default contributing guide of the atlas-platform organization. It applies to every repository
      without a CONTRIBUTING file of its own, which is all of them. `make check` in each repository enforces its section.

      ## Architecture decisions

      Every significant decision is recorded in the repository it affects, in the format that repository uses.
      Since 2026-10-01 every new record names the people who made the decision (older records predate this).

      ### atlas-gateway (Nygard ADRs)

      - `docs/adr/NNNN-kebab-case-title.md`, numbered sequentially (the highest number plus one, four digits).
      - Template: `# N. Title`, then `Date: YYYY-MM-DD` and `Deciders: <names>` on the next two lines, then `## Status`,
        `## Context`, `## Decision`, `## Consequences`. A new ADR has the status `Proposed`.
      - An ADR that replaces another says `Supersedes ADR-NNNN` under its status, and the replaced ADR's status line
        becomes `Superseded by ADR-NNNN`. Nothing else in an accepted ADR changes.

      ### atlas-billing (MADR 4)

      - `docs/decisions/NNNN-title-with-dashes.md`, numbered sequentially.
      - YAML front matter with the keys `status: proposed`, `date: YYYY-MM-DD` and `decision-makers: <names>`, in that order.
      - Sections in order: `# <Title>`, `## Context and Problem Statement`, `## Considered Options` (a bullet list of at
        least two options) and `## Decision Outcome`, whose first line is `Chosen option: "<option>", because <reason>.`
        and which ends with a `### Consequences` subsection of `* Good, because …` and `* Bad, because …` bullets.

      ### atlas-routing (decision log)

      - No file per decision: append a section to `docs/decision-log.md`, newest last:
        `## DL-<n>: <title> (<YYYY-MM-DD>)`, a blank line, one Y-statement paragraph
        (`In the context of …, facing …, we decided for … and against …, to achieve …, accepting ….`), a blank line,
        and `Deciders: <names>`.

      ### atlas-tracking (proposed ADRs)

