            ---
            status: proposed
            date: 2026-10-26
            decision-makers: Priya Raman, Jonas Weber
            ---

            # Bill usage monthly in arrears

            ## Context and Problem Statement

            Prepaid credits confuse customers and create refunds.

            ## Considered Options

            - Prepaid credits
            - Monthly billing in arrears

            ## Decision Outcome

            Chosen option: "Monthly billing in arrears", because it matches how customers budget.

            ### Consequences

            * Good, because invoices match actual usage.
            * Bad, because we carry credit risk for one month.
