          pyretry/__init__.py: |
            import functools
            import random
            import time


            def retry(attempts=3, base_delay=0.5, max_delay=30.0, jitter=0.0, on_retry=None):
                def decorate(fn):
                    @functools.wraps(fn)
                    def wrapper(*args, **kwargs):
                        for attempt in range(1, attempts + 1):
                            try:
                                return fn(*args, **kwargs)
                            except KeyboardInterrupt:
                                raise
                            except Exception:
                                if attempt == attempts:
                                    raise
                                delay = min(base_delay * 2 ** (attempt - 1), max_delay)
                                delay += random.uniform(0, jitter)
                                if on_retry:
                                    on_retry(attempt, delay)
                                time.sleep(delay)
                    return wrapper
                return decorate
