# Scripted environment for Ouroboros run mode (see ../README.md).
#
# Each item is one owner who talks to Ouroboros in its Main room and keeps four small repositories under ~/src.
# The owner's organization keeps its default contribution guide in its organization-level `.github` repository,
# checked out at ~/src/.github (`org_guide` below becomes ~/src/.github/CONTRIBUTING.md). GitHub applies that file
# to every repository without a CONTRIBUTING file of its own, and none of these repositories has one, so exploring
# a repository does not reveal the rules. `make check` in each repository enforces its section of the guide; the
# adapter simulates it from `rules` (fail-fast: the first failing rule is reported and names the guide section).
# Nothing is executed. Every repository has at least one organization rule that tool defaults and the existing
# files do not reveal (several were introduced recently, so older files predate them).
#
# Phases: two learning tasks (L1, L2) before the evolution cycle, two test tasks (T1, T2) after it. The test
# repositories follow other sections of the same guide, so the lesson "read the organization guide first"
# transfers, while copying the learning repositories' rules does not.
#
# Fields `design` and `reference` are for analysis and validation only and are never sent to a model.

world: |
  # WORLD.md — Environment Profile

  This is where I currently exist. It defines my hardware, OS, and local constraints.

  ## System
  - **OS**: Linux 6.8 (x86_64)
  - **CPU**: 8 vCPU
  - **RAM**: 16.0 GB
  - **User**: owner
  - **Current Directory**: /home/owner

  ## Available Tools
  The following binaries are available in my PATH:
  `git, python3, make, node, npx`

  ## File System Rules
  My human's repositories live in `~/src`. My own repository and data live in my installation folder.

  *(Generated automatically on first boot)*

